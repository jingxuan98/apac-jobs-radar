name: Daily job radar

on:
  schedule:
    # 08:00 Malaysia / Singapore time (UTC+8) = 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:        # lets you run it on demand from the Actions tab

permissions:
  contents: write           # to commit data/seen.json and docs/  (Vercel deploys off this push)

concurrency:
  group: job-radar
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run the radar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          PAGE_URL:           ${{ vars.PAGE_URL }}   # your https://<project>.vercel.app
        run: node src/index.js

      - name: Commit refreshed data
        run: |
          git config user.name  "job-radar[bot]"
          git config user.email "job-radar@users.noreply.github.com"
          git add data docs
          git diff --staged --quiet || git commit -m "radar: $(date -u +%Y-%m-%d)"
          git push
